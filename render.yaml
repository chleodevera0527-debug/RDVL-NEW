services:
  - type: web
    name: rdevera-truck-monitor
    runtime: python
    plan: starter
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
    startCommand: python -m gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rdevera-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: ALLOW_DEFAULT_ADMIN
        value: "0"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD_RESET
        value: "0"

databases:
  - name: rdevera-db
    databaseName: rdevera
    user: rdevera
    plan: basic-256mb
