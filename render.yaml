services:
  - type: web
    name: rdevera-truck-monitor
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rdevera-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: ALLOW_DEFAULT_ADMIN
        value: "0"
      - key: ADMIN_USERNAME
        value: "admin"

  - type: pserv
    name: rdevera-db
    plan: basic-256mb
    databaseName: rdevera
    user: rdevera
